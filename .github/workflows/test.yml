name: Run Tests

on:
  push:
    branches: [ "main" ] # Or your default branch
  pull_request:
    branches: [ "main" ] # Or your default branch

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # The Telegram bot is a C++20 binary (bot-cpp/), its self-tests are the
    # authoritative gate (751 checks). ubuntu-latest ships a C++20-capable g++.
    - name: Build and run C++20 bot tests
      run: |
        cd bot-cpp
        ./build.sh
        ./build/boombot-tests

    # The standalone C wagering service builds and tests with bare gcc.
    - name: Build and run C wagering service tests
      run: ./wagering-service/test.sh

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Required by the MMO integration tests: javac/java, node/npm (TS client),
    # and curl (vendors the sqlite-jdbc driver). All present on ubuntu-latest.
    - name: Install dependencies
      run: python -m pip install --upgrade pip && pip install -r requirements.txt

    - name: Run surviving Python integration tests
      env:
        TELEGRAM_TOKEN: "test_token"
      run: pytest tests/test_c_wagering_service.py tests/test_mmo_server.py -v

    - name: Set up flyctl
      uses: superfly/flyctl-actions/setup-flyctl@master
      with:
        version: 0.3.110

    - name: Run deployability check
      env:
        FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      run: flyctl deploy --build-only
