name: Run Tests

on:
  push:
    branches: ["main"]
    # Docs/config-only churn skips the whole (expensive) suite.
    paths-ignore:
      - "**/*.md"
      - ".env.example"
      - ".gitignore"
      - ".dockerignore"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - ".env.example"
      - ".gitignore"
      - ".dockerignore"

# One active run per branch/PR: a new push cancels the stale run instead of
# queueing behind it. Big win during rapid iteration.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The Telegram bot is a C++20 binary (bot-cpp/); its self-tests are the
  # authoritative gate (751 checks). ubuntu-latest ships a C++20-capable g++.
  cpp:
    name: C++20 bot (build + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Build and run C++20 bot tests
        run: |
          cd bot-cpp
          ./build.sh
          ./build/boombot-tests

  # The standalone C wagering service builds and tests with bare gcc.
  wagering:
    name: C wagering service (build + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Build and run C wagering service tests
        run: ./wagering-service/test.sh

  # Cross-language integration: boots the real C and Java services from source.
  integration:
    name: Python integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Required by the MMO tests: javac/java, node/npm (TS client), and curl
      # (vendors the sqlite-jdbc driver). Preload the TS toolchain here so
      # mmo-server/build.sh's conditional npm install is a warm cache hit.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: mmo-server/package-lock.json
      - name: Install MMO client TypeScript toolchain
        run: npm ci --prefix mmo-server --no-audit --no-fund

      - name: Build C wagering service (needed by pytest)
        run: ./wagering-service/build.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Install Python test dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run surviving Python integration tests
        env:
          TELEGRAM_TOKEN: "test_token"
        run: pytest tests/test_c_wagering_service.py tests/test_mmo_server.py -v

  # Full image gate: proves the Dockerfile + all three toolchains still produce
  # a deployable image. Built with --remote-only so it lands in Fly's shared
  # builder cache and the actual deploy on main gets a warm build.
  deployability:
    name: Deployable image check
    runs-on: ubuntu-latest
    needs: [cpp, wagering, integration]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@v1
        with:
          version: "0.4.85"

      - name: Build the production image (no deploy)
        # Fork PRs have no token; skip so the check doesn't hard-fail.
        if: env.FLY_API_TOKEN != ''
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --build-only --remote-only

  # Aggregate gate. The repository ruleset ("Pass CI in PR") requires a status
  # check named `test` (the historical single-job id). Because we now run the
  # suite as parallel jobs, we re-emit a job with id `test` that only passes
  # when every job above it passed. This keeps the required check satisfied
  # without needing admin to rewrite the ruleset, and it stays green no matter
  # how the underlying jobs get renamed later. Note: the job id (not `name`)
  # determines the check context, so leave it as `test`.
  test:
    runs-on: ubuntu-latest
    needs: [cpp, wagering, integration, deployability]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Fail if any pipeline job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: All CI jobs passed
        run: echo "Pipeline green"
