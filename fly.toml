# fly.toml file generated for boom-bot

app = "boom-bot" # Replace with your desired app name on Fly.io
primary_region = "iad" # Choose a region close to you or your users

[build]
  # Tells Fly to use the Dockerfile in the root directory
  dockerfile = "Dockerfile"

# Mount the persistent volume
[mounts]
  source = "bot_data"
  destination = "/data"

# Keep the SQLite database and the existing bot's JSON state on the volume.
# These defaults fit a single shared-cpu-1x Machine with 256 MB of RAM.
[env]
  BOT_DATA_DIR = "/data"
  CHESS_DATABASE_PATH = "/data/chess.sqlite3"
  STOCKFISH_PATH = "/usr/games/stockfish"
  STOCKFISH_HASH_MB = "64"
  STOCKFISH_THREADS = "1"
  STOCKFISH_DEPTH = "12"
  STOCKFISH_GAME_DEPTH = "12"
  STOCKFISH_ANALYSIS_DEPTH = "12"
  CHESS_ANALYSIS_INTERVAL = "15"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  processes = ["app"]

# Optional: Define internal port if needed for health checks
# [http_service]
#   internal_port = 8080
#   force_https = true
#   auto_stop_machines = true
#   auto_start_machines = true
#   min_machines_running = 0 # Set to 1 if you want it always running

# Define the command to run your application
# This is usually handled by the Dockerfile's CMD, but can be overridden here if needed.
